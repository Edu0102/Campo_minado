<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Campo Minado</title>
    <script>
    </script>
    <link rel="stylesheet" href="campominado.css">
</head>

<body>
    <div class="container">
        <header>
            <div><a class="btnVoltar" href="">voltar</a></div>
            <div>
                <h1 class="tituloJogo">Campo Minado</h1>
            </div>
            <div class="empty">vazio</div>
        </header>
        <div id=mainPanel>
            <div class="escrito">
                <h1 id="dificuldadeSelect">Dificuldade:</h1>
                <input type="button" id="btndifeasy" onClick="dificuldadeSelect(9, 9, 10)" value="Fácil">
                <input type="button" id="btndifeasy" onClick="dificuldadeSelect(16, 16, 40)" value="Médio">
                <input type="button" id="btndifeasy" onClick="dificuldadeSelect(30, 16, 99)" value="Dificil">
                <p id="minasCounter">Minas: x</p>
                <p id="bandeirasCounter">Bandeiras: x</p>
            </div>
            <!--<div class="wiperLine"></div> Futuramente linha Limpadora(explicassão issue no git)-->
            <input type="button" id="btnreset" onClick="resetGame();" value="Reiniciar">
            <div class="bordaCampo">
                <div class="board" id="board">
                </div>
            </div>

        </div>
        <script src="campominado.js"></script>
    </div>
</body>

</html>
