<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>campo minado</title>
        <script>
            function CriarJogo(){
                //set tamanho do jogo
                var tamanhox = 5;
                var tamanhoy = 5;
                var valores = [];
                for (var i = 0; i < tamanhox; i++){
                    valores[i] = [];
                    for (var j = 0; j < tamanhoy; j++){
                        valores[i][j] = Math.random() < 0.8 ? 0 : 1;
                    }
                }
                return valores;
            }
            document.getElementById.getElementByTagName("body")[0].onload = function(){
                var jogo = CriarJogo();
                var tabela = document.getElementById("jogo").getElementsByTagName("tbody")[0];
            }
                
        </script>
    </head>
    <body>
        <h1>Campo Minado</h1>
        <p>jogo de Campo Minado!</p>
        <div> <!--jogo -->
            <table id="jogo" border="1">

            </table>
        </div>
            
    </body>

</html>
